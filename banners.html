<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' https: data:; base-uri 'none'; form-action 'none'">
<title>Баннер</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

  .cards { padding: 16px; }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 216px;
    padding: 24px;
    border-radius: 16px;
    overflow: hidden;
    color: var(--ink);
    background: var(--bg);
    text-decoration: none;
  }
  .card:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card > :not(img) { position: relative; }

  .mark { font-size: 12px; line-height: 16px; opacity: .75; }
  .title {
    margin: 8px 0 6px;
    font: 600 30px/1.2 Georgia, "Times New Roman", serif;
    text-wrap: balance;
  }
  .text { margin: 0 0 16px; font-size: 16px; line-height: 22px; }
  .action {
    align-self: flex-start;
    margin-top: auto;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    line-height: 20px;
    color: var(--on-action);
    background: var(--action);
  }

  .to2 { --bg: #F6F1EA; --ink: #3A2A1C; --action: #A65F45; --on-action: #FFFFFF; }

  @media (max-width: 480px) {
    .title { font-size: 24px; }
  }
</style>
</head>
<body>
  <!--
    Один баннер — один блок <a class="card">.
    Что менять: адрес в href, заголовок, текст и надпись на кнопке.
    Своя картинка на весь баннер: положите файл рядом и добавьте первой строкой внутри <a>:
      <img src="имя-файла.jpg" alt="Что на картинке">
    Скрипты в приложении не работают.
  -->
  <main class="cards">
    <a class="card to2" href="https://to2app.love/" target="_blank" rel="sponsored noopener noreferrer">
      <span class="mark">Реклама</span>
      <p class="title">To2 — маленький мир на двоих</p>
      <p class="text">Квест дня, письма, общая комната и питомец. Бесплатно.</p>
      <span class="action">Открыть</span>
    </a>
  </main>
</body>
</html>
